[workspace]
resolver = "3"
members = [
    "crates/orbd",
    "crates/orbd-proto",
    "crates/orbd-guest",
    "crates/orbd-vm",
    "crates/orbd-qemu",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/samcm/orbd"
rust-version = "1.90"
publish = false

[workspace.dependencies]
orbd-proto = { path = "crates/orbd-proto", default-features = false }
orbd-vm = { path = "crates/orbd-vm" }
orbd-qemu = { path = "crates/orbd-qemu" }

anyhow = "1"
async-trait = "0.1"
bollard = "0.21"
bytes = "1"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hmac = "0.13"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
prost = "0.14"
prost-types = "0.14"
rand = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
fail = "0.5"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "router"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
# Firecracker API client (HTTP/1.1 over its unix socket).
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }
# Registry client for image preparation; TLS via rustls with the ring provider that
# tonic already uses (one crypto provider).
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"] }
# Boat API client; the same build of reqwest that oci-client uses.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tar = { version = "0.4", default-features = false }
nix = { version = "0.31", features = ["fs", "process", "signal", "user", "socket"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.22"
time = { version = "0.3", default-features = false, features = ["std"] }
# QMP client. Passively maintained: pinned exactly and wrapped narrowly (crates/orbd-qemu/src/qmp.rs).
qapi = { version = "=0.15.0", features = ["qmp", "async-tokio-all"] }
x509-parser = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
