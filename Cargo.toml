[workspace]
resolver = "3"
members = ["crates/orbd", "crates/orbd-proto", "crates/orbd-guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/samcm/orbd"
rust-version = "1.90"

[workspace.dependencies]
orbd-proto = { path = "crates/orbd-proto" }

anyhow = "1"
async-trait = "0.1"
bollard = "0.21"
bytes = "1"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
prost = "0.14"
prost-types = "0.14"
rand = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
fail = "0.5"
toml = "1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "router"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }
nix = { version = "0.31", features = ["fs", "process", "signal", "user", "socket"] }
rcgen = "0.14"
x509-parser = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
