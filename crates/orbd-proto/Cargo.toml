[package]
name = "orbd-proto"
description = "Generated protobuf and gRPC types for orbd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
prost.workspace = true
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }

[build-dependencies]
prost-build.workspace = true
tonic-prost-build = { workspace = true, optional = true }
protoc-bin-vendored.workspace = true

[features]
default = ["control"]
# The control plane's gRPC services. Without it only the guest protocol is built (plain
# prost), small enough for static guest binaries.
control = ["dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build"]
