name: ci

# Pull requests (including forks) run with a read-only token on GitHub-hosted
# runners only. Nothing here is privileged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: cargo fmt --all --check

  deny:
    # Advisories (RustSec), yanked crates, licenses and sources; see deny.toml.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  clippy:
    name: clippy (${{ matrix.features || 'default' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ["", orbd/failpoints]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked --features "${{ matrix.features }}" -- -D warnings

  # With failpoints: every test, plus those that inject faults. Failpoints that are not
  # set do nothing, and clippy checks the default build.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: orbd/failpoints
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # orbd's nftables table is loaded in a throwaway user and network namespace
      # (ORBD_TEST_NFT makes that test fail instead of skipping).
      - name: nft in unprivileged namespaces
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn nft list ruleset
      - run: cargo test --workspace --locked --features orbd/failpoints
        env:
          ORBD_TEST_NFT: "1"

  # Apple Silicon agents. GitHub's macOS runners cannot start Hypervisor.framework
  # guests, so this lints the macOS code and runs every test that needs no VM; the VM
  # gates in tests/kvm.rs run on a Mac by hand (see its header).
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # orbd-guest runs inside Linux guests only.
      - run: cargo clippy --workspace --exclude orbd-guest --all-targets --locked --features orbd/failpoints -- -D warnings
      - run: cargo test --workspace --exclude orbd-guest --locked --features orbd/failpoints

  build:
    uses: ./.github/workflows/build.yml

  # The KVM gates and the root-only unit tests, built once for every kvm job (beside the
  # release build, not after it): static musl binaries run in the image whatever its libc.
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl && rustup default stable
          sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: kvm-musl
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          exes() { jq -r 'select(.profile.test == true) | "\(.target.name) \(.executable)"'; }
          {
            cargo test --locked -p orbd --features failpoints --test kvm --test dns_codec \
              --target x86_64-unknown-linux-musl --no-run --message-format=json | exes
            cargo test --locked -p orbd-vm -p orbd-qemu -p orbd --lib \
              --target x86_64-unknown-linux-musl --no-run --message-format=json | exes
          } | sed "s|$PWD/||" >gates.txt
          cat gates.txt
          # The gates run the orbd built with them (CARGO_BIN_EXE_orbd, an absolute path:
          # every job checks out to the same one). A tar keeps the modes.
          cut -d' ' -f2 gates.txt | xargs tar -cf gates.tar gates.txt target/x86_64-unknown-linux-musl/debug/orbd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gates
          path: gates.tar
          if-no-files-found: error
          retention-days: 14

  # The amd64 image for the kvm jobs, and separately the multi-arch build, so the kvm
  # jobs do not wait for arm64.
  image:
    needs: [build]
    uses: ./.github/workflows/image.yml
    with:
      push: false
      artifact: true
      multiarch: false

  image-multiarch:
    needs: [build]
    uses: ./.github/workflows/image.yml
    with:
      push: false

  # Real VMs on GitHub-hosted runners: ephemeral VMs with /dev/kvm and no secrets, so
  # pull requests run here too. Every suite runs inside the image built above, so they
  # test the shipped QEMU, Firecracker and guest kernel.
  # - qemu, firecracker: the gates in tests/kvm.rs (ignored by default) through a real
  #   coordinator and agent, on that runtime, split across three runners of about the same
  #   length: the crash-boundary gate; sleep, project snapshots and restricted egress; the
  #   rest (agent restarts and upgrades, flow log, nested KVM).
  # - container: tests/container-e2e.sh, the coordinator and agent containers as deployed,
  #   with a QEMU and a Firecracker orb on one agent.
  kvm:
    name: kvm (${{ matrix.suite }}${{ matrix.part && format(', {0}', matrix.part) || '' }})
    needs: [build, image, gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [qemu, firecracker]
        part: [crash, sleep, rest]
        include:
          - part: crash
            gates: agent_crash_at_publication_boundaries
          - part: sleep
            gates: sleep_preserves spawn_boots_from_project_snapshot restricted_egress held_sleeps
          - part: rest
            gates: >-
              --skip agent_crash_at_publication_boundaries --skip sleep_preserves
              --skip spawn_boots_from_project_snapshot --skip restricted_egress
              --skip held_sleeps
          - suite: container
    env:
      ROOTFS: kvm-guest/rootfs.ext4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger is asynchronous; without settle the check below can race it.
          sudo udevadm settle
          ls -l /dev/kvm || { echo "::error::This runner has no /dev/kvm"; exit 1; }
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable after the udev rule"; exit 1; }
      # Orbs get /dev/kvm only if the runner's KVM nests. Without it the gates still run
      # but skip their nested-guest assertions (ORBD_KVM_NESTED=0).
      - name: Nested virtualization
        run: |
          grep -m1 'model name' /proc/cpuinfo
          nested=$(cat /sys/module/kvm_intel/parameters/nested /sys/module/kvm_amd/parameters/nested 2>/dev/null || true)
          echo "kvm nested parameter: ${nested:-absent}"
          case "$nested" in
            Y|1) echo ORBD_KVM_NESTED=1 >>"$GITHUB_ENV" ;;
            *)
              echo "::warning title=No nested virtualization::This runner's KVM does not nest; nested-guest assertions are SKIPPED."
              echo ORBD_KVM_NESTED=0 >>"$GITHUB_ENV" ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{image-amd64,guest-kernel,orbd-guest-*,gates}"
          path: artifacts
      - run: |
          zstd -dc artifacts/image-amd64/image-amd64.tar.zst | docker load
          tar -xf artifacts/gates/gates.tar
      - id: rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ROOTFS }}
          key: kvm-rootfs-${{ hashFiles('crates/orbd/tests/kvm-guest/**', 'guest/rootfs/**', 'guest/kernel/build.sh', 'guest/kernel/orbd.config', 'crates/orbd-guest/**', 'proto/**', 'Cargo.lock') }}
      - if: steps.rootfs.outputs.cache-hit != 'true'
        name: Build the test root disk
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mmdebstrap debian-archive-keyring busybox-static
          # mmdebstrap's unshare mode needs unprivileged user namespaces, and its
          # namespace root (a subordinate uid) reads the inputs from this checkout.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chmod o+x "$HOME"
          mkdir -p "$(dirname "$ROOTFS")"
          crates/orbd/tests/kvm-guest/build-rootfs.sh \
            artifacts/orbd-guest-x86_64-unknown-linux-musl/orbd-guest artifacts/guest-kernel/bzImage "$ROOTFS"

      - if: matrix.part == 'rest'
        name: The previous release's orbd and orbd-guest, for the upgrade gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return; [ "$i" = 5 ] && return 1; sleep 20; done; }
          # The highest release (by version, no drafts or prereleases) that is not this
          # commit: a release commit's own run upgrades from the release before it.
          tags=$(retry gh release list -R "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts \
            --exclude-pre-releases --json tagName -q '.[].tagName')
          tag=
          for t in $(sort -rV <<<"$tags"); do
            sha=$(retry gh api "repos/$GITHUB_REPOSITORY/commits/$t" -q .sha)
            [ -n "$sha" ] || { echo "::error::no commit for release $t"; exit 1; }
            [ "$sha" != "$GITHUB_SHA" ] && { tag=$t; break; }
          done
          [ -n "$tag" ] || { echo "::error::no previous release"; exit 1; }
          mkdir -p previous && cd previous
          retry gh release download "$tag" -R "$GITHUB_REPOSITORY" --clobber \
            -p "orbd-$tag-x86_64-unknown-linux-musl" -p "orbd-guest-$tag-x86_64-unknown-linux-musl" \
            -p SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          mv "orbd-$tag-x86_64-unknown-linux-musl" orbd
          mv "orbd-guest-$tag-x86_64-unknown-linux-musl" orbd-guest
          chmod 755 orbd orbd-guest
          echo "upgrade gate from $tag: $(./orbd --version)"
      - if: matrix.suite != 'container'
        name: Run the gates in the image
        # procps provides the `kill` the test harness runs; QEMU is the image's own.
        # GATES is a libtest name filter, split into words on purpose.
        env:
          GATES: ${{ matrix.gates }}
        run: |
          # The README's agent flags (no --privileged), plus SYS_PTRACE for the gates
          # themselves: they inspect jailed VMMs through /proc/<pid>/root.
          previous=
          if [ "${{ matrix.part }}" = rest ]; then
            previous="-e ORBD_KVM_PREVIOUS_AGENT=$PWD/previous/orbd -e ORBD_KVM_PREVIOUS_GUEST=$PWD/previous/orbd-guest"
          fi
          docker run --rm --cap-add SYS_ADMIN --cap-add NET_ADMIN --cap-add SYS_PTRACE \
            --device /dev/kvm --device /dev/net/tun \
            --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            -v "$PWD:$PWD" -w "$PWD/crates/orbd" \
            -e ORBD_KVM_KERNEL=/usr/share/orbd/bzImage -e "ORBD_KVM_ROOTFS=$PWD/$ROOTFS" -e ORBD_KVM_NESTED \
            -e ORBD_KVM_RUNTIME=${{ matrix.suite }} $previous \
            --entrypoint sh orbd:smoke -c \
            'apt-get update -qq && apt-get install -y -qq procps >/dev/null && exec "$0" --ignored --test-threads=1 --nocapture "$@"' \
            "$PWD/$(awk '$1 == "kvm" { print $2 }' gates.txt)" $GATES
      - if: matrix.suite == 'qemu' && matrix.part == 'rest'
        name: Root-only unit tests in the image
        # The VMM and DNS codec jails, the disk tools and image sandbox as deployed: root in the image with
        # the README's agent flags. ORBD_TEST_JAIL=1 turns a skipped test into a failure.
        # Docker's default seccomp refuses pivot_root, so the jail takes its fallback
        # there; seccomp=unconfined runs its pivot_root path too.
        run: |
          exe() { awk -v n="$1" '$1 == n { print $2 }' gates.txt; }
          for seccomp in default unconfined; do
            docker run --rm --cap-add SYS_ADMIN --cap-add NET_ADMIN \
              --device /dev/kvm --device /dev/net/tun \
              --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
              $([ "$seccomp" = unconfined ] && echo --security-opt seccomp=unconfined) \
              -e ORBD_TEST_JAIL=1 -v "$PWD:$PWD" -w "$PWD" --entrypoint sh orbd:smoke -c "
                set -e
                $(exe orbd_vm) --test-threads=1 jail:: process::
                $(exe orbd_qemu) --test-threads=1 qmp::
                $(exe dns_codec) --test-threads=1
                $(exe orbd) --test-threads=1 --include-ignored image::sandbox image::rootfs \
                  snapshots_read_only vmm_sockets_must uids_are ownership_fixups \
                  install_prefixes log_tails external_data"
          done

      - if: matrix.suite == 'container'
        run: crates/orbd/tests/container-e2e.sh orbd:smoke "$ROOTFS"

  # Single required status check for branch rules and auto-merge.
  ci-ok:
    if: always()
    needs: [fmt, deny, clippy, test, macos, build, gates, image, image-multiarch, kvm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All CI jobs succeeded
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
