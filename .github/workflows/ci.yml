name: ci

# Pull requests (including forks) run with a read-only token on GitHub-hosted
# runners only. Nothing here is privileged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: cargo fmt --all --check

  deny:
    # Advisories (RustSec), yanked crates, licenses and sources; see deny.toml.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  clippy:
    name: clippy (${{ matrix.features || 'default' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ["", orbd/failpoints]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked --features "${{ matrix.features }}" -- -D warnings

  test:
    name: test (${{ matrix.features || 'default' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ["", orbd/failpoints]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked --features "${{ matrix.features }}"

  build:
    uses: ./.github/workflows/build.yml

  image:
    needs: [build]
    uses: ./.github/workflows/image.yml
    with:
      push: false
      artifact: true

  # Real VMs on GitHub-hosted runners: ephemeral VMs with /dev/kvm and no secrets, so
  # pull requests run here too. Every suite runs inside the image built above, so they
  # test the shipped QEMU, Firecracker and guest kernel.
  # - qemu, firecracker: the gates in tests/kvm.rs (ignored by default) through a real
  #   coordinator and agent, on that runtime.
  # - container: tests/container-e2e.sh, the coordinator and agent containers as deployed,
  #   with a QEMU and a Firecracker orb on one agent.
  kvm:
    name: kvm (${{ matrix.suite }})
    needs: [build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [qemu, firecracker, container]
    env:
      # Not under target/: the rust cache restores target/ over it.
      ROOTFS: kvm-guest/rootfs.ext4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger is asynchronous; without settle the check below can race it.
          sudo udevadm settle
          ls -l /dev/kvm || { echo "::error::This runner has no /dev/kvm"; exit 1; }
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable after the udev rule"; exit 1; }
      # Orbs get /dev/kvm only if the runner's KVM nests. Without it the gates still run
      # but skip their nested-guest assertions (ORBD_KVM_NESTED=0).
      - name: Nested virtualization
        run: |
          grep -m1 'model name' /proc/cpuinfo
          nested=$(cat /sys/module/kvm_intel/parameters/nested /sys/module/kvm_amd/parameters/nested 2>/dev/null || true)
          echo "kvm nested parameter: ${nested:-absent}"
          case "$nested" in
            Y|1) echo ORBD_KVM_NESTED=1 >>"$GITHUB_ENV" ;;
            *)
              echo "::warning title=No nested virtualization::This runner's KVM does not nest; nested-guest assertions are SKIPPED."
              echo ORBD_KVM_NESTED=0 >>"$GITHUB_ENV" ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{image-amd64,guest-kernel,orbd-guest-*}"
          path: artifacts
      - run: zstd -dc artifacts/image-amd64/image-amd64.tar.zst | docker load
      - id: rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ROOTFS }}
          key: kvm-rootfs-${{ hashFiles('crates/orbd/tests/kvm-guest/**', 'guest/rootfs/**', 'guest/kernel/build.sh', 'guest/kernel/orbd.config', 'crates/orbd-guest/**', 'proto/**', 'Cargo.lock') }}
      - if: steps.rootfs.outputs.cache-hit != 'true'
        name: Build the test root disk
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mmdebstrap debian-archive-keyring busybox-static
          # mmdebstrap's unshare mode needs unprivileged user namespaces, and its
          # namespace root (a subordinate uid) reads the inputs from this checkout.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chmod o+x "$HOME"
          mkdir -p "$(dirname "$ROOTFS")"
          crates/orbd/tests/kvm-guest/build-rootfs.sh \
            artifacts/orbd-guest-x86_64-unknown-linux-musl/orbd-guest artifacts/guest-kernel/bzImage "$ROOTFS"

      # Static musl test binaries run in the image whatever its libc.
      - if: matrix.suite != 'container'
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl && rustup default stable
          sudo apt-get install -y -qq musl-tools
      - if: matrix.suite != 'container'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: kvm-musl
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: matrix.suite != 'container'
        name: Build the gates
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo test --locked -p orbd --features failpoints --test kvm \
            --target x86_64-unknown-linux-musl --no-run --message-format=json |
            jq -r 'select(.profile.test == true and .target.name == "kvm") | .executable' >gates.txt
          cat gates.txt
      - if: matrix.suite != 'container'
        name: Run the gates in the image
        # procps provides the `kill` the test harness runs; QEMU is the image's own.
        run: |
          docker run --rm --privileged -v "$PWD:$PWD" -w "$PWD/crates/orbd" \
            -e ORBD_KVM_KERNEL=/usr/share/orbd/bzImage -e "ORBD_KVM_ROOTFS=$PWD/$ROOTFS" -e ORBD_KVM_NESTED \
            -e ORBD_KVM_RUNTIME=${{ matrix.suite }} \
            --entrypoint sh orbd:smoke -c \
            'apt-get update -qq && apt-get install -y -qq procps >/dev/null && exec "$0" --ignored --test-threads=1 --nocapture' \
            "$(cat gates.txt)"

      - if: matrix.suite == 'container'
        run: crates/orbd/tests/container-e2e.sh orbd:smoke "$ROOTFS"

  # Single required status check for branch rules and auto-merge.
  ci-ok:
    if: always()
    needs: [fmt, deny, clippy, test, build, image, kvm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All CI jobs succeeded
        run: test "$RESULTS" = "success"
        env:
          RESULTS: ${{ join(needs.*.result, ' ') == 'success success success success success success success' && 'success' || 'failure' }}
