name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: orbd-*
          path: artifacts
      - name: Package
        run: |
          mkdir dist
          for dir in artifacts/orbd-*; do
            name=$(basename "$dir")
            bin=orbd; case "$name" in orbd-guest-*) bin=orbd-guest ;; esac
            target=${name#"$bin"-}
            install -m 0755 "$dir/$bin" "dist/$bin-$GITHUB_REF_NAME-$target"
          done
          cd dist && sha256sum orbd-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  image:
    needs: [build, publish]
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true
