# Routine bumps arrive as one grouped PR per ecosystem each week; major updates
# (including 0.x minor bumps, which are breaking in Cargo) come as individual PRs.
# Nothing merges automatically: a maintainer reviews every PR (see README).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
